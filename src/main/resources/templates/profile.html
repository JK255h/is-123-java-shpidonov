<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет - JavaSurveyApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Временная навигация без фрагмента для теста -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">SurveySystem</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <h2 th:text="'Привет, ' + ${user.username}">Привет!</h2>
                <p th:text="${user.email}">email</p>
                <hr>
                <div class="row">
                    <div class="col-md-6">
                        <div class="p-3 bg-primary text-white rounded">
                            Опросов: <span th:text="${formsCount}">0</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="p-3 bg-success text-white rounded">
                            Ответов: <span th:text="${totalResponses}">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <h3>Ваши последние опросы:</h3>
        <ul class="list-group shadow-sm border-0">
            <li class="list-group-item" th:each="form : ${latestForms}">
                <span th:text="${form.title}">Заголовок</span>
                <span th:if="${form.isPublished == 1}" class="badge bg-success float-end">Опубликован</span>
                <span th:unless="${form.isPublished == 1}" class="badge bg-warning float-end text-dark">Черновик</span>
            </li>
            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(latestForms)}">
                Опросов пока нет.
            </li>
        </ul>
        
        <div class="mt-4">
            <a th:href="@{/forms}" class="btn btn-outline-primary">К списку опросов</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger">Выйти</button>
            </form>
        </div>
    </div>
</body>
</html>
