<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - JavaSurveyApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container py-4">
        <div class="row g-4">
            <!-- Левая колонка: Информация о пользователе -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body text-center py-4">
                        <div class="mb-3">
                            <i class="bi bi-person-circle text-primary" style="font-size: 4rem;"></i>
                        </div>
                        <h4 class="card-title mb-1" th:text="${user.username}">Имя пользователя</h4>
                        <p class="text-muted mb-3" th:text="${user.email}">user@example.com</p>
                        
                        <div>
                            <span th:if="${user.isAdmin == 1}" class="badge bg-danger rounded-pill px-3">
                                <i class="bi bi-shield-lock me-1"></i>Администратор
                            </span>
                            <span th:unless="${user.isAdmin == 1}" class="badge bg-secondary rounded-pill px-3">
                                <i class="bi bi-person me-1"></i>Пользователь
                            </span>
                        </div>
                    </div>
                    <div class="list-group list-group-flush border-top">
                        <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <span><i class="bi bi-hash me-2"></i>ID пользователя</span>
                            <span class="fw-bold" th:text="${user.userId}"></span>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0 py-3">
                        <form th:action="@{/logout}" method="post" class="d-grid">
                            <button type="submit" class="btn btn-outline-danger">
                                <i class="bi bi-box-arrow-right me-2"></i>Выйти из системы
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Быстрые действия -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold py-3">
                        <i class="bi bi-lightning-charge me-2"></i>Быстрые действия
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <a th:href="@{/forms/create}" class="btn btn-primary text-start">
                                <i class="bi bi-plus-lg me-2"></i>Создать новый опрос
                            </a>
                            <a th:href="@{/forms}" class="btn btn-outline-primary text-start">
                                <i class="bi bi-list-ul me-2"></i>Управлять опросами
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: Статистика и Последние опросы -->
            <div class="col-lg-8">
                <!-- Карточки статистики -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="flex-shrink-0 bg-primary bg-opacity-10 p-3 rounded-3">
                                    <i class="bi bi-file-earmark-text text-primary fs-3"></i>
                                </div>
                                <div class="ms-3">
                                    <h6 class="text-muted mb-0">Мои опросы</h6>
                                    <h3 class="fw-bold mb-0" th:text="${formsCount}">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="flex-shrink-0 bg-success bg-opacity-10 p-3 rounded-3">
                                    <i class="bi bi-chat-dots text-success fs-3"></i>
                                </div>
                                <div class="ms-3">
                                    <h6 class="text-muted mb-0">Всего ответов</h6>
                                    <h3 class="fw-bold mb-0" th:text="${totalResponses}">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Последние опросы -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold">Последние опросы</h5>
                        <a th:href="@{/forms}" class="btn btn-sm btn-link text-decoration-none p-0">Смотреть все</a>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Название</th>
                                        <th>Статус</th>
                                        <th class="text-end pe-4">Действия</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="form : ${latestForms}">
                                        <td class="ps-4">
                                            <div class="fw-bold" th:text="${form.title}"></div>
                                            <small class="text-muted" th:text="${#temporals.format(form.createdAt, 'dd.MM.yyyy HH:mm')}"></small>
                                        </td>
                                        <td>
                                            <span th:if="${form.isPublished == 1}" class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3">
                                                Опубликован
                                            </span>
                                            <span th:unless="${form.isPublished == 1}" class="badge bg-warning-subtle text-warning border border-warning-subtle rounded-pill px-3">
                                                Черновик
                                            </span>
                                        </td>
                                        <td class="text-end pe-4">
                                            <div class="btn-group">
                                                <a th:href="@{/forms/{id}(id=${form.formId})}" class="btn btn-sm btn-outline-secondary" title="Просмотр">
                                                    <i class="bi bi-eye"></i>
                                                </a>
                                                <a th:href="@{/forms/{id}/edit(id=${form.formId})}" class="btn btn-sm btn-outline-primary" title="Редактировать">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <a th:href="@{/forms/{id}/results(id=${form.formId})}" class="btn btn-sm btn-outline-info" title="Результаты">
                                                    <i class="bi bi-bar-chart"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(latestForms)}">
                                        <td colspan="3" class="text-center py-4 text-muted">
                                            У вас пока нет созданных опросов.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
