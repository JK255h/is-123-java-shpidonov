<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - JavaSurveyApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container py-4">
        <div class="row g-4">
            <!-- Левая колонка -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4 text-center py-4">
                    <div class="card-body">
                        <i class="bi bi-person-circle text-primary mb-3" style="font-size: 4rem;"></i>
                        <h4 class="card-title mb-1" th:text="${user.username}">User</h4>
                        <p class="text-muted mb-3" th:text="${user.email}">user@example.com</p>
                        <span th:if="${user.isAdmin == 1}" class="badge bg-danger rounded-pill px-3">Администратор</span>
                        <span th:unless="${user.isAdmin == 1}" class="badge bg-secondary rounded-pill px-3">Пользователь</span>
                    </div>
                    <div class="card-footer bg-white border-top-0 pt-0">
                        <form th:action="@{/logout}" method="post" class="d-grid mt-3 px-3">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Выйти</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold border-0 pt-3">Действия</div>
                    <div class="card-body d-grid gap-2">
                        <a th:href="@{/forms/create}" class="btn btn-primary btn-sm">Создать опрос</a>
                        <a th:href="@{/forms}" class="btn btn-outline-primary btn-sm">Мои опросы</a>
                    </div>
                </div>
            </div>

            <!-- Правая колонка -->
            <div class="col-lg-8">
                <!-- Статистика -->
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <div class="card shadow-sm border-0 text-center p-3">
                            <div class="text-muted small">Опросы</div>
                            <div class="h3 fw-bold mb-0 text-primary" th:text="${formsCount ?: 0}">0</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="card shadow-sm border-0 text-center p-3">
                            <div class="text-muted small">Ответы</div>
                            <div class="h3 fw-bold mb-0 text-success" th:text="${totalResponses ?: 0}">0</div>
                        </div>
                    </div>
                </div>

                <!-- Список -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold">Последние опросы</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">Название</th>
                                        <th>Статус</th>
                                        <th class="text-end pe-3">Действия</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="form : ${latestForms}">
                                        <td class="ps-3">
                                            <div class="fw-bold" th:text="${form.title}"></div>
                                            <small class="text-muted" th:if="${form.createdAt != null}" 
                                                   th:text="${#temporals.format(form.createdAt, 'dd.MM.yyyy')}"></small>
                                        </td>
                                        <td>
                                            <span th:if="${form.isPublished == 1}" class="badge bg-success-subtle text-success">Ok</span>
                                            <span th:unless="${form.isPublished == 1}" class="badge bg-warning-subtle text-warning">Draft</span>
                                        </td>
                                        <td class="text-end pe-3">
                                            <div class="btn-group">
                                                <a th:href="@{/forms/{id}(id=${form.formId})}" class="btn btn-sm btn-link"><i class="bi bi-eye"></i></a>
                                                <a th:href="@{/forms/{id}/edit(id=${form.formId})}" class="btn btn-sm btn-link text-primary"><i class="bi bi-pencil"></i></a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${latestForms == null or #lists.isEmpty(latestForms)}">
                                        <td colspan="3" class="text-center py-3 text-muted">Опросов нет</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
