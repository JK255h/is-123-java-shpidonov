<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header-css}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center">Вход</h2>
            <div th:if="${param.error}" class="alert alert-danger">Неверный логин или пароль</div>
            <div th:if="${param.logout}" class="alert alert-info">Вы вышли из системы</div>
            <div th:if="${param.registered}" class="alert alert-success">Регистрация успешна! Войдите</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Логин (или Email)</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
