<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header-css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">SurveySystem</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/forms/public}">Все опросы</a>
                <span class="navbar-text me-3" sec:authorize="isAuthenticated()">
                    Привет, <span sec:authentication="name">User</span>!
                </span>
                <a class="nav-link" th:href="@{/forms}" sec:authorize="isAuthenticated()">Мои опросы</a>
                <a class="nav-link" th:href="@{/profile}" sec:authorize="isAuthenticated()">Профиль</a>
                <a class="nav-link" th:href="@{/login}" sec:authorize="isAnonymous()">Вход</a>
                <a class="nav-link" th:href="@{/register}" sec:authorize="isAnonymous()">Регистрация</a>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Выход</button>
                </form>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
