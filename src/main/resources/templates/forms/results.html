<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header-css}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/forms}">Мои опросы</a></li>
            <li class="breadcrumb-item"><a th:href="@{'/forms/' + ${form.formId}}" th:text="${form.title}">Название</a></li>
            <li class="breadcrumb-item active" aria-current="page">Результаты</li>
        </ol>
    </nav>

    <div class="mb-5 d-flex justify-content-between align-items-center">
        <div>
            <h2 th:text="'Результаты опроса: ' + ${form.title}">Результаты</h2>
            <p class="text-muted">Всего ответов: <span th:text="${responsesCount}" class="fw-bold">0</span></p>
        </div>
        <div class="btn-group" th:if="${responsesCount > 0}">
            <button type="button" class="btn btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-download"></i> Экспорт
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" th:href="@{'/forms/' + ${form.formId} + '/results/export/txt'}">TXT формат</a></li>
                <li><a class="dropdown-item" th:href="@{'/forms/' + ${form.formId} + '/results/export/xml'}">XML формат</a></li>
                <li><a class="dropdown-item" th:href="@{'/forms/' + ${form.formId} + '/results/export/html'}">HTML формат</a></li>
            </ul>
        </div>
    </div>

    <div th:if="${responsesCount == 0}" class="alert alert-info">
        Пока никто не прошел этот опрос.
    </div>

    <div th:each="question, iter : ${questions}" class="card mb-4 shadow-sm" th:if="${responsesCount > 0}">
        <div class="card-header bg-white">
            <h5 class="mb-0" th:text="${(iter.index + 1) + '. ' + question.title}">Вопрос</h5>
        </div>
        <div class="card-body">
            <!-- For Choice/Checkbox Questions -->
            <div th:if="${question.questionType == 'MULTIPLE_CHOICE' || question.questionType == 'CHECKBOX' || question.questionType == 'DROPDOWN'}" class="row">
                <div class="col-md-6">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Вариант</th>
                                <th>Кол-во</th>
                                <th>%</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry : ${stats.get(question.questionId)}">
                                <td th:text="${entry.key}">Вариант</td>
                                <td th:text="${entry.value}">0</td>
                                <td th:text="${responsesCount > 0 ? (entry.value * 100 / responsesCount) + '%' : '0%'}">0%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="col-md-6">
                    <canvas th:id="'chart-' + ${question.questionId}" style="max-height: 250px;"></canvas>
                </div>
            </div>

            <!-- For Scale Question -->
            <div th:if="${question.questionType == 'SCALE'}">
                <canvas th:id="'chart-' + ${question.questionId}" style="max-height: 250px;"></canvas>
            </div>

            <!-- For Grid Question -->
            <div th:if="${question.questionType == 'GRID'}" class="table-responsive">
                <table class="table table-bordered table-sm text-center">
                    <thead>
                        <tr>
                            <th></th>
                            <th th:each="col : ${#strings.arraySplit(settingsMap[question.questionId].gridColumnsText, '|')}" th:text="${col.trim()}">Колонка</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rowName : ${#strings.arraySplit(settingsMap[question.questionId].gridRowsText, '|')}">
                            <td class="text-start fw-bold" th:text="${rowName.trim()}">Строка</td>
                            <td th:each="colName : ${#strings.arraySplit(settingsMap[question.questionId].gridColumnsText, '|')}" 
                                th:text="${gridStats.get(question.questionId).get(rowName.trim()).get(colName.trim())}">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- For Text/Other Questions -->
            <div th:if="${question.questionType != 'MULTIPLE_CHOICE' && question.questionType != 'CHECKBOX' && question.questionType != 'DROPDOWN' && question.questionType != 'SCALE' && question.questionType != 'GRID'}">
                <p class="text-muted small">Список ответов:</p>
                <div class="border rounded p-3 bg-light" style="max-height: 400px; overflow-y: auto;">
                    <div th:each="answer, aIter : ${textAnswers.get(question.questionId)}">
                        <div class="py-2" th:text="${answer}">Ответ</div>
                        <hr th:if="${!aIter.last}" class="my-1 text-muted opacity-25">
                    </div>
                    <div class="text-muted" th:if="${textAnswers.get(question.questionId) == null || textAnswers.get(question.questionId).isEmpty()}">Нет ответов</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const stats = /*[[${stats}]]*/ {};
    const questions = /*[[${questions}]]*/ [];

    document.addEventListener('DOMContentLoaded', function() {
        questions.forEach(q => {
            const qStats = stats[q.questionId];
            if (!qStats) return;

            const ctx = document.getElementById('chart-' + q.questionId);
            if (!ctx) return;

            const labels = Object.keys(qStats);
            const data = Object.values(qStats);

            if (q.questionType === 'MULTIPLE_CHOICE' || q.questionType === 'CHECKBOX') {
                new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: [
                                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'right' }
                        }
                    }
                });
            } else if (q.questionType === 'SCALE') {
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels.sort((a, b) => parseInt(a) - parseInt(b)),
                        datasets: [{
                            label: 'Кол-во оценок',
                            data: labels.map(l => qStats[l]),
                            backgroundColor: '#36A2EB'
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true, ticks: { stepSize: 1 } }
                        }
                    }
                });
            }
        });
    });
    /*]]>*/
</script>
</body>
</html>
