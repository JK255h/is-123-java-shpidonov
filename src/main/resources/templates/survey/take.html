<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header-css}"></head>
<style>
    .question-image { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 15px; display: block; }
    .option-image { max-width: 200px; height: auto; border-radius: 4px; margin-top: 5px; display: block; cursor: pointer; }
</style>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="card-title text-center mb-4" th:text="${form.title}">Название опроса</h1>
                    <p class="text-muted text-center mb-5" th:text="${form.description}">Описание опроса</p>

                    <form th:action="@{'/survey/' + ${form.formId} + '/submit'}" method="post">
                        <div th:each="question, iter : ${questions}" class="mb-4 p-4 border rounded bg-white shadow-sm">
                            <h5 th:text="${(iter.index + 1) + '. ' + question.title}">Текст вопроса</h5>
                            
                            <!-- Изображение вопроса -->
                            <div th:if="${settingsMap[question.questionId] != null and settingsMap[question.questionId].imagePath != null}">
                                <img th:src="${settingsMap[question.questionId].imagePath}" class="question-image shadow-sm" alt="Question Image">
                            </div>

                            <p class="text-muted small mb-3" th:text="${question.description}"></p>

                            <!-- TEXT Question -->
                            <div th:if="${question.questionType == 'TEXT'}">
                                <input type="text" class="form-control" th:name="'q_' + ${question.questionId}" 
                                       th:required="${question.isRequired == 1}" placeholder="Ваш ответ...">
                            </div>

                            <!-- PARAGRAPH Question -->
                            <div th:if="${question.questionType == 'PARAGRAPH'}">
                                <textarea class="form-control" th:name="'q_' + ${question.questionId}" 
                                          th:required="${question.isRequired == 1}" rows="4" placeholder="Ваш развернутый ответ..."></textarea>
                            </div>

                            <!-- DATE Question -->
                            <div th:if="${question.questionType == 'DATE'}">
                                <input type="date" class="form-control" th:name="'q_' + ${question.questionId}" 
                                       th:required="${question.isRequired == 1}">
                            </div>

                            <!-- TIME Question -->
                            <div th:if="${question.questionType == 'TIME'}">
                                <input type="time" class="form-control" th:name="'q_' + ${question.questionId}" 
                                       th:required="${question.isRequired == 1}">
                            </div>

                            <!-- DROPDOWN Question -->
                            <div th:if="${question.questionType == 'DROPDOWN'}">
                                <select class="form-select" th:name="'q_' + ${question.questionId}" th:required="${question.isRequired == 1}">
                                    <option value="" disabled selected>Выберите вариант...</option>
                                    <option th:each="option : ${optionsMap.get(question.questionId)}" 
                                            th:value="${option.optionId}" th:text="${option.optionText}"></option>
                                </select>
                            </div>

                            <!-- SCALE Question -->
                            <div th:if="${question.questionType == 'SCALE'}" class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="fw-bold" th:text="${settingsMap[question.questionId] != null ? settingsMap[question.questionId].scaleMin : 1}">1</span>
                                    <input type="range" class="form-range mx-3 scale-slider" 
                                           th:min="${settingsMap[question.questionId] != null ? settingsMap[question.questionId].scaleMin : 1}" 
                                           th:max="${settingsMap[question.questionId] != null ? settingsMap[question.questionId].scaleMax : 5}" 
                                           th:name="'q_' + ${question.questionId}"
                                           oninput="updateValue(this)">
                                    <span class="fw-bold" th:text="${settingsMap[question.questionId] != null ? settingsMap[question.questionId].scaleMax : 5}">5</span>
                                </div>
                                <div class="text-center">
                                    <span class="badge bg-primary fs-6">Выбрано: <span class="current-value" th:text="${settingsMap[question.questionId] != null ? settingsMap[question.questionId].scaleMin : 1}">1</span></span>
                                </div>
                            </div>

                            <!-- GRID Question -->
                            <div th:if="${question.questionType == 'GRID' and settingsMap[question.questionId] != null}" class="table-responsive">
                                <table class="table table-bordered table-striped text-center">
                                    <thead>
                                        <tr>
                                            <th></th>
                                            <th th:each="col : ${#strings.arraySplit(settingsMap[question.questionId].gridColumnsText, '|')}" 
                                                th:if="${!#strings.isEmpty(col.trim())}"
                                                th:text="${col.trim()}">Колонка</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="row, rIdx : ${#strings.arraySplit(settingsMap[question.questionId].gridRowsText, '|')}">
                                            <td th:if="${!#strings.isEmpty(row.trim())}" class="text-start fw-bold" th:text="${row.trim()}">Строка</td>
                                            <td th:each="col, cIdx : ${#strings.arraySplit(settingsMap[question.questionId].gridColumnsText, '|')}"
                                                th:if="${!#strings.isEmpty(row.trim()) and !#strings.isEmpty(col.trim())}">
                                                <input class="form-check-input" type="radio" 
                                                       th:name="'q_' + ${question.questionId} + '_r' + ${rIdx.index}" 
                                                       th:value="${cIdx.index}"
                                                       th:required="${question.isRequired == 1}">
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- MULTIPLE_CHOICE (Radio) -->
                            <div th:if="${question.questionType == 'MULTIPLE_CHOICE'}">
                                <div th:each="option : ${optionsMap.get(question.questionId)}" class="form-check mb-3">
                                    <input class="form-check-input" type="radio" th:name="'q_' + ${question.questionId}" 
                                           th:id="'opt_' + ${option.optionId}" th:value="${option.optionId}" th:required="${question.isRequired == 1}">
                                    <label class="form-check-label w-100" th:for="'opt_' + ${option.optionId}">
                                        <span th:text="${option.optionText}"></span>
                                        <img th:if="${option.imagePath != null}" th:src="${option.imagePath}" class="option-image border shadow-sm" alt="Option Image">
                                    </label>
                                </div>
                            </div>

                            <!-- CHECKBOX -->
                            <div th:if="${question.questionType == 'CHECKBOX'}">
                                <div th:each="option : ${optionsMap.get(question.questionId)}" class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" th:name="'q_' + ${question.questionId}" 
                                           th:id="'opt_' + ${option.optionId}" th:value="${option.optionId}">
                                    <label class="form-check-label w-100" th:for="'opt_' + ${option.optionId}">
                                        <span th:text="${option.optionText}"></span>
                                        <img th:if="${option.imagePath != null}" th:src="${option.imagePath}" class="option-image border shadow-sm" alt="Option Image">
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid mt-5">
                            <button type="submit" class="btn btn-primary btn-lg">Отправить ответы</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function updateValue(slider) {
        const container = slider.closest('.mb-3');
        const display = container.querySelector('.current-value');
        if (display) {
            display.textContent = slider.value;
        }
    }
</script>
</body>
</html>
