<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header-css}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/forms}">Мои опросы</a></li>
            <li class="breadcrumb-item"><a th:href="@{'/forms/' + ${form.formId}}" th:text="${form.title}">Название</a></li>
            <li class="breadcrumb-item active" aria-current="page">Новый вопрос</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Добавить новый вопрос</h2>
                    <form th:action="@{'/questions/create/' + ${form.formId}}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label">Текст вопроса</label>
                            <input type="text" class="form-control" id="title" name="title" required placeholder="Введите текст вопроса...">
                        </div>
                        <div class="mb-3">
                            <label for="questionImage" class="form-label">Изображение к вопросу (фото или GIF)</label>
                            <input type="file" class="form-control" id="questionImage" name="questionImage" accept="image/jpeg,image/png,image/gif">
                            <div class="form-text">Поддерживаются форматы JPG, PNG, GIF.</div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Описание/подсказка (необязательно)</label>
                            <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="questionType" class="form-label">Тип вопроса</label>
                                <select class="form-control" id="questionType" name="questionType" required onchange="toggleOptions()">
                                    <option value="TEXT">Текстовый ответ (короткий)</option>
                                    <option value="PARAGRAPH">Текстовый ответ (длинный)</option>
                                    <option value="MULTIPLE_CHOICE">Один из списка (Radio)</option>
                                    <option value="CHECKBOX">Несколько из списка (Checkbox)</option>
                                    <option value="DROPDOWN">Выпадающий список</option>
                                    <option value="SCALE">Шкала (1-10)</option>
                                    <option value="DATE">Дата</option>
                                    <option value="TIME">Время</option>
                                    <option value="GRID">Сетка (Matrix)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3 d-flex align-items-end">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="isRequired" name="isRequired" value="true">
                                    <label class="form-check-label" for="isRequired">
                                        Обязательный вопрос
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div id="options-container" class="mt-4" style="display: none;">
                            <h5>Варианты ответов</h5>
                            <div id="options-list">
                                <div class="card mb-3 option-item border-light shadow-sm">
                                    <div class="card-body">
                                        <div class="input-group mb-2">
                                            <input type="text" class="form-control" name="options" placeholder="Текст варианта 1">
                                            <button type="button" class="btn btn-outline-danger" onclick="removeOption(this)">Удалить</button>
                                        </div>
                                        <div class="mb-1">
                                            <label class="form-label small">Картинка варианта (необязательно)</label>
                                            <input type="file" class="form-control form-control-sm" name="optionImages" accept="image/jpeg,image/png,image/gif">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addOption()">Добавить вариант</button>
                        </div>

                        <!-- Настройки шкалы -->
                        <div id="scale-settings" class="mt-4" style="display: none;">
                            <h5>Настройки шкалы</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Минимум</label>
                                    <input type="number" class="form-control" name="scaleMin" value="1">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Максимум</label>
                                    <input type="number" class="form-control" name="scaleMax" value="5">
                                </div>
                            </div>
                        </div>

                        <!-- Настройки сетки -->
                        <div id="grid-settings" class="mt-4" style="display: none;">
                            <h5>Настройки сетки</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Строки (каждая с новой строки)</label>
                                    <textarea class="form-control" name="gridRowsText" rows="4" placeholder="Вопрос 1&#10;Вопрос 2"></textarea>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Колонки (каждая с новой строки)</label>
                                    <textarea class="form-control" name="gridColumnsText" rows="4" placeholder="Плохо&#10;Хорошо&#10;Отлично"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success">Создать вопрос</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleOptions() {
        const type = document.getElementById('questionType').value;
        const optContainer = document.getElementById('options-container');
        const scaleSettings = document.getElementById('scale-settings');
        const gridSettings = document.getElementById('grid-settings');
        
        optContainer.style.display = (type === 'MULTIPLE_CHOICE' || type === 'CHECKBOX' || type === 'DROPDOWN') ? 'block' : 'none';
        scaleSettings.style.display = (type === 'SCALE') ? 'block' : 'none';
        gridSettings.style.display = (type === 'GRID') ? 'block' : 'none';
    }

    function addOption() {
        const list = document.getElementById('options-list');
        const count = list.getElementsByClassName('option-item').length + 1;
        const div = document.createElement('div');
        div.className = 'card mb-3 option-item border-light shadow-sm';
        div.innerHTML = `
            <div class="card-body">
                <div class="input-group mb-2">
                    <input type="text" class="form-control" name="options" placeholder="Текст варианта ${count}">
                    <button type="button" class="btn btn-outline-danger" onclick="removeOption(this)">Удалить</button>
                </div>
                <div class="mb-1">
                    <label class="form-label small">Картинка варианта (необязательно)</label>
                    <input type="file" class="form-control form-control-sm" name="optionImages" accept="image/jpeg,image/png,image/gif">
                </div>
            </div>
        `;
        list.appendChild(div);
    }

    function removeOption(btn) {
        const list = document.getElementById('options-list');
        if (list.getElementsByClassName('option-item').length > 1) {
            // Кнопка в input-group, который в card-body, который в option-item
            btn.closest('.option-item').remove();
        } else {
            alert('Должен быть хотя бы один вариант ответа');
        }
    }
</script>
</body>
</html>
